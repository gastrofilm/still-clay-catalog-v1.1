<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Still Clay — Master Product Catalog v1.1</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Helvetica Neue',Arial,sans-serif;background:#FAF9F6;color:#2C2C2A;font-size:13px}
:root{
  --ink:#2C2C2A;--mid:#888780;--pale:#F1EFE8;--bone:#D3D1C7;--bone2:#B4B2A9;
  --accent:#BA7517;--accent-pale:#FAEEDA;
  --c01:#E1F5EE;--c01t:#085041;
  --c02:#E6F1FB;--c02t:#0C447C;
  --c03:#FBEAF0;--c03t:#72243E;
  --c04:#FAEEDA;--c04t:#633806;
  --c05:#EEEDFE;--c05t:#3C3489;
}

/* HEADER */
.hdr{background:#2C2C2A;color:#FAF9F6;padding:28px 32px 22px;display:flex;justify-content:space-between;align-items:flex-end}
.hdr-brand{font-size:10px;letter-spacing:.35em;color:#B4B2A9;margin-bottom:6px;text-transform:uppercase}
.hdr-title{font-family:Georgia,serif;font-size:24px;font-weight:normal;letter-spacing:.02em}
.hdr-meta{font-size:11px;color:#888780;text-align:right;line-height:1.9}

/* TOOLBAR */
.toolbar{background:#FAF9F6;border-bottom:1px solid #D3D1C7;padding:10px 32px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.toolbar label{font-size:11px;color:#888780;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.toolbar input,.toolbar select{font-size:12px;padding:5px 10px;border:1px solid #D3D1C7;border-radius:4px;background:#fff;color:#2C2C2A;height:30px}
.toolbar input{width:180px}
.tbtn{font-size:11px;padding:5px 14px;border:1px solid #D3D1C7;border-radius:4px;background:#fff;color:#2C2C2A;cursor:pointer;height:30px;display:flex;align-items:center;gap:5px;white-space:nowrap;letter-spacing:.04em}
.tbtn:hover{background:#F1EFE8;border-color:#B4B2A9}
.tbtn.primary{background:#2C2C2A;color:#FAF9F6;border-color:#2C2C2A}
.tbtn.primary:hover{background:#444441}
.rate-row{display:flex;align-items:center;gap:8px;margin-left:auto}
.rate-row input{width:90px}

/* LEGEND */
.legend{padding:8px 32px;background:#F1EFE8;border-bottom:1px solid #D3D1C7;display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.leg-item{display:flex;align-items:center;gap:6px;font-size:11px;color:#5F5E5A}
.leg-dot{width:8px;height:8px;border-radius:50%}

/* TABLE WRAPPER */
.tbl-wrap{overflow-x:auto;padding:0 32px 48px}

/* COLUMN HEADER + DRAG */
table{width:100%;border-collapse:collapse;table-layout:fixed;min-width:900px}
thead tr{background:#F1EFE8;border-bottom:1px solid #B4B2A9}
th{padding:10px 8px;text-align:left;font-size:10px;font-weight:500;letter-spacing:.15em;text-transform:uppercase;color:#5F5E5A;white-space:nowrap;cursor:grab;user-select:none;position:relative;border-right:1px solid #D3D1C7}
th:last-child{border-right:none}
th.dragging{opacity:.4;background:#D3D1C7}
th.drag-over{background:#FAEEDA;border-right:2px solid #BA7517}
th.col-hide{display:none}
th .th-inner{display:flex;align-items:center;gap:4px}
th .sort-btn{font-size:9px;color:#B4B2A9;cursor:pointer;margin-left:auto}
th .sort-btn:hover{color:#2C2C2A}
th .hide-col{font-size:10px;color:#B4B2A9;cursor:pointer;margin-left:2px;padding:0 2px}
th .hide-col:hover{color:#e74c3c}

/* CATEGORY SECTION HEADER */
.cat-row td{background:#F1EFE8;font-size:11px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:#5F5E5A;padding:8px 10px;border-bottom:1px solid #D3D1C7;border-top:2px solid #D3D1C7}

/* DATA ROWS */
td{padding:8px;border-bottom:1px solid #F1EFE8;vertical-align:middle;border-right:1px solid #F1EFE8;color:#2C2C2A}
td:last-child{border-right:none}
td.col-hide{display:none}
tr:hover td{background:#FAEEDA20}
tr.dragging-row{opacity:.4}
tr.drag-over-row td{border-top:2px solid #BA7517}

/* EDITABLE CELLS */
td[contenteditable="true"]{outline:none;cursor:text}
td[contenteditable="true"]:focus{background:#fffce8;box-shadow:inset 0 0 0 1.5px #BA7517}

/* CELL TYPES */
.sku-code{font-family:'Courier New',monospace;font-size:11px;letter-spacing:.06em;white-space:nowrap}
.cat-pill{display:inline-block;font-size:10px;letter-spacing:.08em;padding:2px 7px;border-radius:2px;text-transform:uppercase;font-weight:500;white-space:nowrap}
.cat-01{background:var(--c01);color:var(--c01t)}
.cat-02{background:var(--c02);color:var(--c02t)}
.cat-03{background:var(--c03);color:var(--c03t)}
.cat-04{background:var(--c04);color:var(--c04t)}
.cat-05{background:var(--c05);color:var(--c05t)}
.price-cell{font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right;padding-right:12px}
.price-retail{color:#0F6E56;font-weight:500}
.price-thb{color:#185FA5}
.price-comm{color:#854F0B}
.name-jp{font-size:11px;color:#888780;margin-top:1px}
.img-cell{width:64px;text-align:center}
.img-cell img{width:52px;height:52px;object-fit:contain;border-radius:3px;border:0.5px solid #D3D1C7;background:#fff}
.no-img{width:52px;height:52px;background:#F1EFE8;border:0.5px dashed #B4B2A9;border-radius:3px;display:inline-flex;align-items:center;justify-content:center;font-size:10px;color:#B4B2A9}
.kiln-badge{font-size:10px;color:#888780;background:#F1EFE8;border:1px solid #D3D1C7;padding:2px 7px;border-radius:2px;white-space:nowrap}

/* MODAL */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;justify-content:center;align-items:center}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:8px;padding:28px 32px;min-width:340px;max-width:520px;box-shadow:0 4px 32px rgba(0,0,0,.15)}
.modal h3{font-size:15px;font-weight:500;margin-bottom:16px;color:#2C2C2A}
.modal input{width:100%;padding:8px 12px;border:1px solid #D3D1C7;border-radius:4px;font-size:13px;margin-bottom:12px}
.modal label{font-size:12px;color:#888780;margin-bottom:4px;display:block}
.modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}

/* COLUMN VISIBILITY PANEL */
.col-panel{display:none;background:#fff;border:1px solid #D3D1C7;border-radius:6px;padding:16px;position:absolute;z-index:50;top:42px;left:0;min-width:200px;box-shadow:0 4px 16px rgba(0,0,0,.1)}
.col-panel.show{display:block}
.col-panel-wrap{position:relative}
.col-check{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:12px;color:#2C2C2A;cursor:pointer}
.col-check input{cursor:pointer}

/* ROW COUNT */
.row-count{font-size:11px;color:#888780;padding:6px 32px;border-top:1px solid #D3D1C7;background:#FAF9F6}

@media print{.toolbar,.legend,.row-count{display:none}.hdr{print-color-adjust:exact}}
</style>
</head>
<body>

<div class="hdr">
  <div>
    <div class="hdr-brand">Still Clay</div>
    <div class="hdr-title">Master Product Catalog</div>
  </div>
  <div class="hdr-meta">
    <span>v1.1 &nbsp;|&nbsp; 2026-06-09</span><br>
    <span>33 SKUs across 4 kilns</span>
  </div>
</div>

<div class="toolbar">
  <label>Filter:</label>
  <input type="text" id="searchBox" placeholder="Search SKU, name, kiln..." oninput="renderTable()">
  <select id="filterKiln" onchange="renderTable()">
    <option value="">All Kilns</option>
    <option>Yamahei</option>
    <option>Kanezen</option>
    <option>Risogama</option>
    <option>Hataman</option>
  </select>
  <select id="filterCat" onchange="renderTable()">
    <option value="">All Categories</option>
    <option value="01">01 — Dish</option>
    <option value="02">02 — Bowl</option>
    <option value="04">04 — Drinks</option>
    <option value="05">05 — Other</option>
  </select>

  <div class="col-panel-wrap">
    <button class="tbtn" onclick="toggleColPanel()">&#9634; Columns</button>
    <div class="col-panel" id="colPanel"></div>
  </div>
  <button class="tbtn" onclick="openAddCol()">+ Add Column</button>
  <button class="tbtn" onclick="addRow()">+ Add Row</button>
  <button class="tbtn primary" onclick="exportCSV()">&#8595; Export CSV</button>

  <div class="rate-row">
    <label>JPY/THB:</label>
    <input type="number" id="rateInput" value="0.237" step="0.001" min="0.01" oninput="renderTable()" style="width:80px">
  </div>
</div>

<div class="legend">
  <span style="font-size:11px;color:#888780;letter-spacing:.1em;text-transform:uppercase;margin-right:4px">Categories</span>
  <div class="leg-item"><div class="leg-dot" style="background:#5DCAA5"></div>01 Dish</div>
  <div class="leg-item"><div class="leg-dot" style="background:#85B7EB"></div>02 Bowl</div>
  <div class="leg-item"><div class="leg-dot" style="background:#EF9F27"></div>04 Drinks</div>
  <div class="leg-item"><div class="leg-dot" style="background:#AFA9EC"></div>05 Other</div>
  <span style="margin-left:auto;font-size:11px;color:#888780">Drag column headers to reorder &nbsp;|&nbsp; Drag rows to reorder &nbsp;|&nbsp; Click any cell to edit</span>
</div>

<div class="tbl-wrap">
  <table id="catalog">
    <thead id="thead"></thead>
    <tbody id="tbody"></tbody>
  </table>
</div>
<div class="row-count" id="rowCount"></div>

<!-- ADD COLUMN MODAL -->
<div class="modal-bg" id="addColModal">
  <div class="modal">
    <h3>Add custom column</h3>
    <label>Column label</label>
    <input type="text" id="newColName" placeholder="e.g. Stock Qty, Notes, Supplier Code...">
    <label>Default value (optional)</label>
    <input type="text" id="newColDefault" placeholder="Leave blank for empty">
    <div class="modal-btns">
      <button class="tbtn" onclick="closeAddCol()">Cancel</button>
      <button class="tbtn primary" onclick="confirmAddCol()">Add Column</button>
    </div>
  </div>
</div>

const BASE_COLS = [
  {id:'img',     label:'Photo',      w:'68px',  fixed:true,  visible:true},
  {id:'sku',     label:'SKU',        w:'130px', fixed:false, visible:true},
  {id:'cat',     label:'Category',   w:'95px',  fixed:false, visible:true},
  {id:'kiln',    label:'Kiln',       w:'85px',  fixed:false, visible:true},
  {id:'name_en', label:'Product',    w:'200px', fixed:false, visible:true},
  {id:'name_jp', label:'JP Name',    w:'150px', fixed:false, visible:true},
  {id:'size',    label:'Size',       w:'120px', fixed:false, visible:true},
  {id:'jpy',     label:'Unit JPY',   w:'90px',  fixed:false, visible:true},
  {id:'retail_jpy', label:'Retail JPY (+15%)', w:'110px', fixed:false, visible:true},
  {id:'comm_jpy',   label:'Margin JPY (15%)',  w:'100px', fixed:false, visible:true},
  {id:'thb',        label:'Unit THB',          w:'90px',  fixed:false, visible:true},
  {id:'retail_thb', label:'Retail THB (+15%)', w:'110px', fixed:false, visible:true},
  {id:'comm_thb',   label:'Margin THB (15%)',  w:'100px', fixed:false, visible:true},
  {id:'mfr',     label:'Mfr. Code',  w:'100px', fixed:false, visible:true},
];
let cols = BASE_COLS.map(c => ({...c}));

let dragColIdx = null;
let dragRowIdx = null;
let sortField = null;
let sortDir = 1;

// ─── COMPUTE ─────────────────────────────────────────────────
function getRate(){ return parseFloat(document.getElementById('rateInput').value) || 0.237; }
function retail(jpy){ return Math.round(jpy * 1.15); }
function comm(jpy){ return Math.round(jpy * 0.15); }
function toThb(jpy){ return Math.round(jpy * getRate()); }

// ─── RENDER ──────────────────────────────────────────────────
function renderTable(){
  const search = document.getElementById('searchBox').value.toLowerCase();
  const kiln = document.getElementById('filterKiln').value;
  const catF = document.getElementById('filterCat').value;
  const rate = getRate();

  let rows = data.filter(p => {
    if(kiln && p.kiln !== kiln) return false;
    if(catF && p.cat !== catF) return false;
    if(search){
      const hay = [p.sku,p.kiln,p.name_en,p.name_jp,p.cat_name,p.size,p.mfr].join(' ').toLowerCase();
      if(!hay.includes(search)) return false;
    }
    return true;
  });

  if(sortField){
    rows = [...rows].sort((a,b)=>{
      let va = a[sortField]||'', vb = b[sortField]||'';
      if(typeof va==='number') return (va-vb)*sortDir;
      return String(va).localeCompare(String(vb))*sortDir;
    });
  }

  renderHead();

  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';

  // Group by category
  const catOrder = ['01','02','03','04','05'];
  const catNames = {'01':'01 — Dish','02':'02 — Bowl','03':'03 — Utensil','04':'04 — Drinks','05':'05 — Other'};
  const grouped = {};
  rows.forEach(r => { (grouped[r.cat]||=[]).push(r); });

  let rowIdx = 0;
  catOrder.forEach(cat => {
    if(!grouped[cat] || grouped[cat].length===0) return;
    const cspan = cols.filter(c=>c.visible).length;
    const catTr = document.createElement('tr');
    catTr.className = 'cat-row';
    catTr.innerHTML = `<td colspan="${cspan}">${catNames[cat]||cat} &nbsp;<span style="font-weight:400;color:#B4B2A9">${grouped[cat].length} items</span></td>`;
    tbody.appendChild(catTr);

    grouped[cat].forEach(p => {
      const tr = document.createElement('tr');
      tr.dataset.idx = data.indexOf(p);
      tr.draggable = true;
      setupRowDrag(tr);

      const r_jpy = retail(p.jpy);
      const c_jpy = comm(p.jpy);
      const u_thb = toThb(p.jpy);
      const r_thb = toThb(r_jpy);
      const c_thb = toThb(c_jpy);

      const cellMap = {
        img: `<td class="img-cell">${p.img ? `<img src="${p.img}" alt="">` : `<div class="no-img">No img</div>`}</td>`,
        sku: `<td><span class="sku-code">${p.sku}</span></td>`,
        cat: `<td><span class="cat-pill cat-${p.cat}">${p.cat_name}</span></td>`,
        kiln: `<td><span class="kiln-badge">${p.kiln}</span></td>`,
        name_en: `<td contenteditable="true" data-field="name_en" data-pidx="${data.indexOf(p)}">${p.name_en}</td>`,
        name_jp: `<td contenteditable="true" data-field="name_jp" data-pidx="${data.indexOf(p)}" style="color:#888780;font-size:11px">${p.name_jp}</td>`,
        size: `<td contenteditable="true" data-field="size" data-pidx="${data.indexOf(p)}">${p.size}</td>`,
        jpy: `<td class="price-cell" contenteditable="true" data-field="jpy" data-pidx="${data.indexOf(p)}">¥${p.jpy.toLocaleString()}</td>`,
        retail_jpy: `<td class="price-cell price-retail">¥${r_jpy.toLocaleString()}</td>`,
        comm_jpy: `<td class="price-cell price-comm">¥${c_jpy.toLocaleString()}</td>`,
        thb: `<td class="price-cell price-thb">฿${u_thb.toLocaleString()}</td>`,
        retail_thb: `<td class="price-cell price-retail">฿${r_thb.toLocaleString()}</td>`,
        comm_thb: `<td class="price-cell price-comm">฿${c_thb.toLocaleString()}</td>`,
        mfr: `<td contenteditable="true" data-field="mfr" data-pidx="${data.indexOf(p)}" style="font-size:11px;color:#888780">${p.mfr||''}</td>`,
      };

      let html = '';
      cols.forEach(c => {
        if(!c.visible){ return; }
        if(c.custom){
          const val = p[c.id]||c.defaultVal||'';
          html += `<td contenteditable="true" data-field="${c.id}" data-pidx="${data.indexOf(p)}">${val}</td>`;
        } else {
          html += cellMap[c.id]||`<td></td>`;
        }
      });
      tr.innerHTML = html;
      tbody.appendChild(tr);
      rowIdx++;
    });
  });

  document.getElementById('rowCount').textContent = `${rows.length} item${rows.length!==1?'s':''} shown`;
  attachEditListeners();
  updateColPanel();
}

function renderHead(){
  const thead = document.getElementById('thead');
  let html = '<tr>';
  cols.forEach((c,i) => {
    if(!c.visible) return;
    const sortIcon = sortField===c.id ? (sortDir===1?'▲':'▼') : '⇅';
    html += `<th draggable="${!c.fixed}" data-colidx="${i}" style="width:${c.w}" 
      ondragstart="onColDragStart(event,${i})" ondragover="onColDragOver(event,${i})" 
      ondrop="onColDrop(event,${i})" ondragleave="onColDragLeave(event,${i})">
      <div class="th-inner">
        <span>${c.label}</span>
        ${!c.fixed?`<span class="sort-btn" onclick="sortBy('${c.id}')">${sortIcon}</span>`:``}
        ${!c.fixed?`<span class="hide-col" onclick="hideCol(${i})" title="Hide">✕</span>`:''}
      </div>
    </th>`;
  });
  html += '</tr>';
  thead.innerHTML = html;
}

// ─── EDIT ─────────────────────────────────────────────────────
function attachEditListeners(){
  document.querySelectorAll('td[contenteditable]').forEach(td => {
    td.addEventListener('blur', e => {
      const field = td.dataset.field;
      const pidx = parseInt(td.dataset.pidx);
      let val = td.innerText.trim();
      if(field==='jpy'){
        val = parseFloat(val.replace(/[^0-9.]/g,''))||0;
        data[pidx].jpy = val;
        renderTable();
      } else {
        data[pidx][field] = val;
      }
    });
    td.addEventListener('keydown', e => {
      if(e.key==='Enter'){ e.preventDefault(); td.blur(); }
    });
  });
}

// ─── SORT ─────────────────────────────────────────────────────
function sortBy(field){
  if(sortField===field) sortDir*=-1;
  else { sortField=field; sortDir=1; }
  renderTable();
}

// ─── COLUMN DRAG ──────────────────────────────────────────────
function onColDragStart(e,i){ dragColIdx=i; e.currentTarget.classList.add('dragging'); }
function onColDragOver(e,i){ e.preventDefault(); if(i!==dragColIdx) e.currentTarget.classList.add('drag-over'); }
function onColDragLeave(e){ e.currentTarget.classList.remove('drag-over'); }
function onColDrop(e,i){
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  if(dragColIdx===null||i===dragColIdx) return;
  const moved = cols.splice(dragColIdx,1)[0];
  cols.splice(i,0,moved);
  dragColIdx=null;
  renderTable();
}

// ─── ROW DRAG ─────────────────────────────────────────────────
function setupRowDrag(tr){
  tr.addEventListener('dragstart', e => { dragRowIdx=parseInt(tr.dataset.idx); tr.classList.add('dragging-row'); });
  tr.addEventListener('dragend', () => tr.classList.remove('dragging-row'));
  tr.addEventListener('dragover', e => { e.preventDefault(); tr.classList.add('drag-over-row'); });
  tr.addEventListener('dragleave', () => tr.classList.remove('drag-over-row'));
  tr.addEventListener('drop', e => {
    e.preventDefault(); tr.classList.remove('drag-over-row');
    const targetIdx = parseInt(tr.dataset.idx);
    if(dragRowIdx===null||targetIdx===dragRowIdx) return;
    const moved = data.splice(dragRowIdx,1)[0];
    data.splice(targetIdx,0,moved);
    dragRowIdx=null;
    renderTable();
  });
}

// ─── COLUMN VISIBILITY ────────────────────────────────────────
function hideCol(i){ cols[i].visible=false; renderTable(); }
function toggleColPanel(){
  const p = document.getElementById('colPanel');
  p.classList.toggle('show');
  updateColPanel();
}
function updateColPanel(){
  const panel = document.getElementById('colPanel');
  panel.innerHTML = cols.map((c,i)=>`
    <label class="col-check">
      <input type="checkbox" ${c.visible?'checked':''} onchange="cols[${i}].visible=this.checked;renderTable()">
      ${c.label}
    </label>`).join('');
}
document.addEventListener('click', e => {
  if(!e.target.closest('.col-panel-wrap')) document.getElementById('colPanel').classList.remove('show');
});

// ─── ADD COLUMN ───────────────────────────────────────────────
function openAddCol(){ document.getElementById('addColModal').classList.add('show'); document.getElementById('newColName').focus(); }
function closeAddCol(){ document.getElementById('addColModal').classList.remove('show'); }
function confirmAddCol(){
  const label = document.getElementById('newColName').value.trim();
  if(!label) return;
  const def = document.getElementById('newColDefault').value;
  const id = 'custom_'+Date.now();
  cols.push({id,label,w:'120px',fixed:false,visible:true,custom:true,defaultVal:def});
  data.forEach(p => p[id]=def);
  closeAddCol();
  document.getElementById('newColName').value='';
  document.getElementById('newColDefault').value='';
  renderTable();
}

// ─── ADD ROW ──────────────────────────────────────────────────
function addRow(){
  const catFilter = document.getElementById('filterCat').value||'01';
  const newRow = {
    sku:'NEW-'+Date.now().toString().slice(-4),
    kiln:'—', name_en:'New item', name_jp:'', cat:catFilter, cat_name:{
      '01':'Dish','02':'Bowl','03':'Utensil','04':'Drinks','05':'Other'
    }[catFilter]||'Dish',
    size:'', jpy:0, mfr:'', img:''
  };
  cols.filter(c=>c.custom).forEach(c=>newRow[c.id]=c.defaultVal||'');
  data.push(newRow);
  renderTable();
}

// ─── EXPORT CSV ───────────────────────────────────────────────
function exportCSV(){
  const rate = getRate();
  const visibleCols = cols.filter(c=>c.visible&&c.id!=='img');
  const headers = visibleCols.map(c=>c.label).join(',');
  const rows = data.map(p=>{
    return visibleCols.map(c=>{
      let v='';
      if(c.id==='retail_jpy') v=retail(p.jpy);
      else if(c.id==='comm_jpy') v=comm(p.jpy);
      else if(c.id==='thb') v=toThb(p.jpy);
      else if(c.id==='retail_thb') v=toThb(retail(p.jpy));
      else if(c.id==='comm_thb') v=toThb(comm(p.jpy));
      else v=p[c.id]||'';
      v=String(v).replace(/"/g,'""');
      return `"${v}"`;
    }).join(',');
  });
  const csv = [headers,...rows].join('\n');
  const blob = new Blob([csv],{type:'text/csv'});
  const a = document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='still-clay-catalog.csv';
  a.click();
}

// ─── INIT ─────────────────────────────────────────────────────
renderTable();
</script>
</body>
